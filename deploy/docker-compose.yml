services:
  chuanjiu:
    image: ghcr.io/bighb/chuanjiu:${TAG:-latest}
    container_name: chuanjiu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:80"      # 只绑本地回环，只允许宿主 nginx 反代进来
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/bbq/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
