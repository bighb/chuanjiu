server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # 实际产物在 html/bbq/ 下
    index index.html;

    # 目录式路由（/bbq/ingredients → 需要末尾斜杠）会触发 nginx 自动补斜杠重定向，
    # 默认它会拼出带 scheme/host/port 的绝对地址——但容器不知道外面套了几层代理/端口映射，
    # 拼出来的地址在生产环境下会把 https 错重定向成 http。关掉后只发相对路径，交给浏览器用当前
    # origin 自己补全，从根上避免这个问题。
    absolute_redirect off;

    # Astro 的指纹化资源（含它生成的图片），可长期缓存。
    # ^~ 必须有：没有它的话，下面那条正则 location 会抢先匹配 _astro/ 里的图片，
    # 导致指纹化图片只拿到 30 天缓存而不是 immutable。
    location ^~ /bbq/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # _astro/ 之外的图片（如放在 public/ 下的），没有指纹，缓存保守些
    location ~* \.(png|jpe?g|webp|avif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /bbq/404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
