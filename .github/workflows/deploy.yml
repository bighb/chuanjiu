name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:        # 允许手动触发（回滚、重新部署时用得上）

concurrency:
  group: deploy
  cancel-in-progress: false  # 部署不要被中途取消，避免留下半截状态

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置，无需自己配

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # secrets 通过 env 传入而不是直接插值进脚本正文：
      # 私钥是多行内容，直接插值容易被 shell 解析出意外行为
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
              'cd /home/deploy/chuanjiu && docker compose pull && docker compose up -d && docker image prune -f'

      - name: Verify
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://benrush.cn/bbq/)
          echo "GET /bbq/ → $code"
          test "$code" = "200"
